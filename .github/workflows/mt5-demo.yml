name: MetaQuotes Gold read-only tick preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows_mt5:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install and test MetaQuotes-Demo Gold ticks (no trading)
        shell: pwsh
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_INVESTOR_PASSWORD: ${{ secrets.MT5_DEMO_INVESTOR_PASSWORD }}
        run: ./scripts/mt5_probe.ps1
